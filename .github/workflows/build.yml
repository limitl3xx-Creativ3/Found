name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned on purpose: the runner's preinstalled Gradle is newer than
      # AGP 8.5.2 supports, which fails the build.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: gradle :app:lintDebug --no-daemon
        continue-on-error: true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Found.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          allowUpdates: true
          files: Found.apk
          body: Automated build from ${{ github.sha }}
